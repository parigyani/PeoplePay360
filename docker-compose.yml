version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: peoplepay360-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepay360}
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
